schema_version = "1.0.0"

# Extension manifest for Export_To_UE
# https://docs.blender.org/manual/en/latest/advanced/extensions/getting_started.html

id = "export_to_ue"
version = "0.3.2"
name = "Export To UE"
tagline = "Export models to Unreal Engine with proper FBX settings, save to .max via 3ds Max batch, and import .max with unit conversion"
maintainer = "BI1MCS"
type = "add-on"

tags = ["Import-Export"]

blender_version_min = "4.2.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

# Optional: link to documentation, support, source files
website = "https://extensions.blender.org/add-ons/export-to-ue/"

[permissions]
files = "Export FBX files to disk, save .max files, and read/write plugin config"
subprocess = "Invoke 3dsmaxbatch.exe to convert FBX to .max files"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".git",
  "*.zip",
  "*cache*",
  "export_to_ue_config.json",
]
